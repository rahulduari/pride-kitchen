<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pride Kitchen | Food Menu</title>

    <link rel="stylesheet" href="/menu.css">
    <script src="/menu.js" defer></script>
</head>

<body>

<header class="header">
    <h1>PRIDE KITCHEN</h1>
    <p>Authentic Flavours. Unforgettable Taste.</p>
</header>

<main class="menu-page">

    <section class="menu-heading">
        <h2>OUR MENU</h2>
        <p>Explore our delicious varieties</p>
    </section>

    <div class="menu-layout">

        <!-- LEFT CATEGORY SECTION -->
        <aside class="category-sidebar">
            <h3>Categories</h3>
            <div id="category-list"></div>
        </aside>

        <!-- CENTRE FOOD SECTION -->
        <section class="food-section">
            <h3 id="selected-category">Select a Category</h3>
            <div id="food-content"></div>
        </section>

        <!-- RIGHT FOOD DISPLAY SECTION -->
        <aside class="food-display" id="food-display">
            <div class="food-placeholder">
                <span>🍽️</span>
                <h3>Welcome to Pride Kitchen</h3>
                <p>Select a dish to explore its details.</p>
            </div>
        </aside>

    </div>

</main>

<footer class="footer">
    <h3>PRIDE KITCHEN</h3>
    <p>Made with passion, served with pride.</p>
</footer>

</body>
</html>
